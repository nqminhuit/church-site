name: Create Announcement

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Content'
        required: true
      slug:
        description: 'Slug'
        required: true
      summary:
        description: 'Summary'
        required: true
      thumbnail:
        description: 'Thumbnail'
        required: false
        default: default-mass-thumbnail.jpg

jobs:
  create-ann:
    runs-on: ubuntu-latest
    env:
      S3_PATH: 's3://web/church/hyvong'
    steps:
      - name: Create markdown file
        run: printf "%s" "${{ github.event.inputs.content }}" | base64 -d > ${{ github.event.inputs.slug }}.md

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.HOMELAB_MINIO_ACCESS_KEY }}
          aws configure set aws_secret_access_key ${{ secrets.HOMELAB_MINIO_SECRET_KEY }}
          aws configure set region us-east-1
          aws configure set endpoint_url ${{ secrets.HOMELAB_MINIO_ENDPOINT_URL }}

      - name: Upload markdown to MinIO
        run: aws s3 cp ${{ github.event.inputs.slug }}.md ${S3_PATH}/pages/

      - name: Download index.json from MinIO
        run: aws s3 cp ${S3_PATH}/index.json ./index.json

      - name: Append new announcement to index.json
        run: |
          python3 -c "
          import json
          import datetime
          date = datetime.datetime.now().strftime('%Y-%m-%d')
          with open('index.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          new_ann = {
              'date': date,
              'summary': '${{ github.event.inputs.summary }}',
              'thumbnail': '${{ github.event.inputs.thumbnail }}',
              'slug': '${{ github.event.inputs.slug }}'
          }
          found = False
          for i, ann in enumerate(data['announcements']):
              if ann['slug'] == '${{ github.event.inputs.slug }}':
                  data['announcements'][i] = new_ann
                  found = True
                  break
          if not found:
              data['announcements'].insert(0, new_ann)
          with open('index.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "

      - name: Upload updated index.json to MinIO
        run: aws s3 cp index.json ${S3_PATH}/
